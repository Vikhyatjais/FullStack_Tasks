<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 8 - Extended To-Do List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      padding-top: 50px;
    }

    .container {
      background: #fff;
      padding: 20px 25px;
      border-radius: 8px;
      width: 420px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h2 {
      margin-top: 0;
      text-align: center;
      color: #333;
    }

    .input-box {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    #taskInput {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    #addBtn {
      padding: 8px 14px;
      background-color: #2c7be5;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #addBtn:hover {
      background-color: #1a68d1;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      margin-bottom: 8px;
      background-color: #fafafa;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .completed {
      text-decoration: line-through;
      color: #888;
    }

    .btn-group button {
      margin-left: 4px;
      padding: 4px 7px;
      border: 1px solid #ccc;
      background-color: #fff;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
    }

    .btn-group button:hover {
      background-color: #eee;
    }

    .delete-btn {
      color: #d93025;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>My To-Do List</h2>
    <div class="input-box">
      <input type="text" id="taskInput" placeholder="Enter a new task...">
      <button id="addBtn">Add</button>
    </div>
    <ul id="taskList"></ul>
  </div>

  <script>
    const taskInput = document.getElementById("taskInput");
    const addBtn = document.getElementById("addBtn");
    const taskList = document.getElementById("taskList");

    function addTask() {
      const text = taskInput.value.trim();
      if (text === "") {
        alert("Please enter a task.");
        return;
      }

      // Create main list item
      const li = document.createElement("li");

      // Left side: checkbox + task text
      const leftDiv = document.createElement("div");
      leftDiv.className = "task-left";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";

      const span = document.createElement("span");
      span.textContent = text;

      checkbox.addEventListener("change", function () {
        span.classList.toggle("completed", checkbox.checked);
      });

      leftDiv.appendChild(checkbox);
      leftDiv.appendChild(span);

      // Right side: up, down, and delete buttons
      const btnGroup = document.createElement("div");
      btnGroup.className = "btn-group";

      const upBtn = document.createElement("button");
      upBtn.textContent = "↑";
      upBtn.title = "Move Up";
      upBtn.addEventListener("click", function () {
        const prevItem = li.previousElementSibling;
        if (prevItem) {
          taskList.insertBefore(li, prevItem);
        }
      });

      const downBtn = document.createElement("button");
      downBtn.textContent = "↓";
      downBtn.title = "Move Down";
      downBtn.addEventListener("click", function () {
        const nextItem = li.nextElementSibling;
        if (nextItem) {
          taskList.insertBefore(nextItem, li);
        }
      });

      const delBtn = document.createElement("button");
      delBtn.textContent = "✕";
      delBtn.className = "delete-btn";
      delBtn.title = "Delete";
      delBtn.addEventListener("click", function () {
        li.remove();
      });

      btnGroup.appendChild(upBtn);
      btnGroup.appendChild(downBtn);
      btnGroup.appendChild(delBtn);

      li.appendChild(leftDiv);
      li.appendChild(btnGroup);
      taskList.appendChild(li);

      taskInput.value = "";
      taskInput.focus();
    }

    addBtn.addEventListener("click", addTask);

    // Allow pressing Enter to add a task
    taskInput.addEventListener("keypress", function (e) {
      if (e.key === "Enter") {
        addTask();
      }
    });
  </script>

</body>
</html>
